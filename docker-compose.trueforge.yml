# Overlay for this dashboard when TrueForge is already running on the host.
# This does not provision TrueForge. Use its official hosted Compose separately.
services:
  backend:
    environment:
      HARNESS_PROVIDER: trueforge
      TRUEFORGE_BASE_URL: ${TRUEFORGE_DOCKER_URL:-http://host.docker.internal:8791}
      TRUEFORGE_PUBLIC_URL: ${TRUEFORGE_PUBLIC_URL:-http://localhost:8791}
    extra_hosts:
      - "host.docker.internal:host-gateway"
  frontend:
    build:
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
